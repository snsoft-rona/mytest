<!DOCTYPE html>
<html>
  <body>
    <style>
      .App {
        text-align: center;
        background-color: red;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      p {
        margin-top: 0;
      }

      .app-body {
        flex: 1;
      }
      .session-body {
        padding: 0 !important;
      }

      .app-footer input {
        width: 80%;
        margin-bottom: 10px;
        height: 40px;
      }
    </style>
    <div id="app" style="width: 100%; min-height: 100vh; background: red">
      <div class="App">
        <div class="app-body">testing</div>
        <div class="app-footer">
          <input type="text" />
        </div>
      </div>
    </div>

    <script>
      document.querySelectorAll("input, textarea").forEach((input) => {
        input.addEventListener("focus", () => {
          document.body.style.paddingBottom = "300px"; // Adjust as needed

          setTimeout(() => {
            alert(document.body.scrollHeight);
            window.scrollTo(0, document.body.scrollHeight);
          }, 1000);

          //   if ("virtualKeyboard" in navigator) {
          //     navigator.virtualKeyboard.overlaysContent = true;
          //   }
        });

        input.addEventListener("focusout", () => {
          // Keyboard is closed, reset layout
          document.body.style.paddingBottom = "0px";
        });
      });
    </script>
  </body>
</html>
